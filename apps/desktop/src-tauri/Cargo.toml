[package]
name = "airhand-desktop"
version = "0.2.0"
description = "Desktop shell for the AirHand Mouse engine"
authors = ["AirHand"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "airhand_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Spawning and terminating the engine process. Used from Rust only — the webview is never given
# the ability to run programs.
tauri-plugin-shell = "2"

# Process liveness for the handshake reader. A stale handshake file is expected after a hard kill
# — there is no cleanup opportunity — so the reader has to ask the OS whether the pid is still
# running before handing the webview a dead port.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
