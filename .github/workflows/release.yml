# Builds the Windows installer on a clean runner and attaches it to a GitHub release.
#
# The point of building it here rather than uploading a local file: the machine that produced the
# artifact has never had this project's dependencies installed by hand, so a bundle that quietly
# borrows from a developer's Python or Node installation fails here instead of on a user's PC.
#
# Push a `v*` tag to publish. Run it manually (workflow_dispatch) to build without publishing —
# the installer is uploaded as a workflow artifact either way.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with tauri.conf.json would publish v0.2.0 containing a 0.1.0
      # installer. Cheaper to fail here than to explain it later.
      #
      # This guard is necessary and was not sufficient: it compares the tag to the config and stops
      # there. v0.2.0 passed it and still shipped a 0.1.0 installer, because the artifact was never
      # compared to anything. See "Locate the installer" below.
      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "tag $env:GITHUB_REF_NAME does not match tauri.conf.json version ($expected)"
          }
          "version $expected"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install engine dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # One directory, not one file — see the reasoning in backend/airhand.spec.
      - name: Freeze the engine
        working-directory: backend
        run: pyinstaller airhand.spec

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # `bundle.resources` fails the build on a glob that matches nothing, so this has to happen
      # before tauri build, not alongside it.
      - name: Copy the engine into the bundle
        working-directory: apps/desktop
        run: npm run engine:sync

      # The Rust cache covers target/, and target/release/bundle/nsis/ rides along inside it — so a
      # restored cache arrives carrying the *previous* release's installer. Two .exe files then sit
      # in the output directory and only one of them is this build's.
      #
      # Deleting the bundle output costs nothing: it is the packaging step's product, not compiled
      # objects, so nothing here is recompiled because of it.
      - name: Clear bundles left behind by the cache
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          if (Test-Path target/release/bundle) {
            Get-ChildItem target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue |
              ForEach-Object { "removing stale $($_.Name)" }
            Remove-Item target/release/bundle -Recurse -Force
          }

      - name: Build the installer
        working-directory: apps/desktop
        run: npm run tauri build

      # Matches the installer against the configured version rather than taking whatever sorts
      # first. The check at the top of this file compares the *tag* to the config; nothing compared
      # the config to the *artifact* — which is how v0.2.0 shipped a freshly built 0.1.0 installer
      # restored from the cache, named correctly, attached confidently, and wrong.
      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $produced = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($produced.Count -eq 0) { throw "no NSIS installer was produced" }

          $wanted = "*_$($config.version)_*-setup.exe"
          $exe = @($produced | Where-Object { $_.Name -like $wanted })
          if ($exe.Count -ne 1) {
            throw ("expected exactly one installer matching {0}, found: {1}" -f
              $wanted, ($produced.Name -join ', '))
          }

          "path=$($exe[0].FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "{0} ({1:N1} MB)" -f $exe[0].Name, ($exe[0].Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-mouse-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Single-quoted here-string: the notes are markdown full of backticks, which a
          # double-quoted one would eat as escape characters. The tag and repository come from
          # GitHub's own expressions, substituted before PowerShell sees the script.
          $notes = @'
          ## AirHand Mouse ${{ github.ref_name }}

          Download the `.exe` below and run it. It carries the frozen Python engine, so the machine
          needs no Python installation. Installation is per-user and asks for no administrator
          rights.

          **Requirements:** Windows 10 or newer, a webcam, and the WebView2 runtime (present on
          Windows 11; the installer fetches it if it is missing).

          **SmartScreen will warn you** — the installer is not code-signed. Choose *More info →
          Run anyway*.

          First launch walks through a short calibration wizard. Cursor control is off until you
          enable it, and `Ctrl+Alt+Space` disables it instantly at any time.

          See the [README](https://github.com/${{ github.repository }}#readme) for what it does and
          how it is built.
          '@
          gh release create '${{ github.ref_name }}' `
            --title 'AirHand Mouse ${{ github.ref_name }}' `
            --notes $notes `
            '${{ steps.installer.outputs.path }}'
